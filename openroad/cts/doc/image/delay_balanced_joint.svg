<text x="16.0" y="306.0" font-size="12" text-anchor="start" font-weight="400" fill="#0b0b0b" >take the same time.</text>
<text x="264.0" y="52.0" font-size="13" text-anchor="start" font-weight="600" fill="#0b0b0b" >B is later</text>
