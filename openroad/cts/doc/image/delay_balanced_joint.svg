<text x="16.0" y="228.0" font-size="12" text-anchor="start" font-weight="600" fill="#0b0b0b" >A</text>
<rect x="34.0" y="214" width="45.0" height="18" fill="#e1e0d9" stroke="#0b0b0b" stroke-width="1"/>
