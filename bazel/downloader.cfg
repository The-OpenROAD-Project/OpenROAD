# Downloads from SourceForge try the BCR's Cloudflare mirror first. Every
# download is verified against the hash its module or archive pins, so a
# mirror can serve the file but never change it; SourceForge stays the
# fallback.
#
# Bazel matches a rewrite pattern against the whole URL without its
# scheme, so the patterns need neither ^ nor https://, and the
# replacements name no scheme either.
rewrite downloads\.sourceforge\.net/(.*) bcr.cloudflaremirrors.com/downloads.sourceforge.net/$1
rewrite downloads\.sourceforge\.net/(.*) downloads.sourceforge.net/$1

# GNU downloads (m4, through rules_m4) name mirrors.kernel.org and
# ftp.gnu.org; when both time out the build fails. Try GNU's own
# redirector to a nearby mirror and a second mirror first, and keep each
# original URL as the last fallback, since a matching rewrite replaces it.
rewrite mirrors\.kernel\.org/gnu/(.*) ftpmirror.gnu.org/gnu/$1
rewrite mirrors\.kernel\.org/gnu/(.*) ftp.fau.de/gnu/$1
rewrite mirrors\.kernel\.org/gnu/(.*) mirrors.kernel.org/gnu/$1
rewrite ftp\.gnu\.org/gnu/(.*) ftpmirror.gnu.org/gnu/$1
rewrite ftp\.gnu\.org/gnu/(.*) ftp.gnu.org/gnu/$1
