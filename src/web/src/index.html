<!DOCTYPE html>
<html>
<head>
    <title>OpenROAD Web Viewer</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- The stylesheets and the script below are bundled from npm by esbuild
         and embedded in the OpenROAD binary: the viewer must not load code
         from a CDN (issue #11065) and has to work with no network.  The four
         <style> blocks are filled in at build time; theme.js switches the two
         golden-layout themes through their `disabled` property, by id. -->
    <style>/*! vendor.min.css */</style>
    <style id="gl-theme-dark">/*! gl-dark.min.css */</style>
    <style id="gl-theme-light">/*! gl-light.min.css */</style>
    <!-- Last on purpose: style.css ends with a block that overrides the active
         golden-layout theme, and only wins while it comes after it. -->
    <style>/*! app.min.css */</style>
    <!-- `disabled` is a property of <style>, not an attribute, so the light
         theme cannot start disabled from the markup the way the old <link>
         did.  theme.js sets both once it runs; this just avoids the two
         themes applying at once until then. -->
    <script>document.getElementById('gl-theme-light').disabled = true;</script>
</head>
<body>

    <div id="menu-bar"></div>
    <div id="toolbar"></div>
    <div id="gl-container"></div>
    <div id="websocket-status"></div>
    <div id="loading-overlay">
        <div class="loading-overlay-content">
            <div class="spinner"></div>
            <span>Loading shapes…</span>
        </div>
    </div>
    <script defer src="app.min.js"></script>

</body>
</html>
