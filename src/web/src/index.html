<!DOCTYPE html>
<html>
<head>
    <title>OpenROAD Web Viewer</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Every library below is vendored under src/web/third-party and served by
         the OpenROAD binary itself: the viewer must not load code from a CDN
         (issue #11065) and has to work on a machine with no network. -->
    <link rel="stylesheet" href="third-party/leaflet/leaflet.css"/>
    <script src="third-party/leaflet/leaflet.js"></script>

    <link rel="stylesheet" href="third-party/golden-layout/css/goldenlayout-base.css"/>
    <link rel="stylesheet" id="gl-theme-dark" href="third-party/golden-layout/css/themes/goldenlayout-dark-theme.css"/>
    <link rel="stylesheet" id="gl-theme-light" href="third-party/golden-layout/css/themes/goldenlayout-light-theme.css" disabled/>

    <!-- netlistsvg reads ELK off the global scope, so elk has to load first. -->
    <script src="third-party/elkjs/elk.bundled.js"></script>
    <script src="third-party/netlistsvg/netlistsvg.bundle.js"></script>

    <!-- three and golden-layout are ES modules; this must precede the
         <script type="module"> below. -->
    <script type="importmap">
    {
      "imports": {
        "three": "/third-party/three/three.module.min.js",
        "golden-layout": "/third-party/golden-layout/golden-layout.esm.js"
      }
    }
    </script>

    <link rel="stylesheet" href="style.css"/>
</head>
<body>

    <div id="menu-bar"></div>
    <div id="toolbar"></div>
    <div id="gl-container"></div>
    <div id="websocket-status"></div>
    <div id="loading-overlay">
        <div class="loading-overlay-content">
            <div class="spinner"></div>
            <span>Loading shapes…</span>
        </div>
    </div>
    <script type="module" src="main.js"></script>

</body>
</html>
