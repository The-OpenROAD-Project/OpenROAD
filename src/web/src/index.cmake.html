<!DOCTYPE html>
<html>
<head>
    <title>OpenROAD Web Viewer</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- The CMake build serves the sources as they are, with the libraries
         from CDNs; only the Bazel build bundles them (see index.html). -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/golden-layout@2.6.0/dist/css/goldenlayout-base.css"/>
    <link rel="stylesheet" id="gl-theme-dark" href="https://cdn.jsdelivr.net/npm/golden-layout@2.6.0/dist/css/themes/goldenlayout-dark-theme.css"/>
    <link rel="stylesheet" id="gl-theme-light" href="https://cdn.jsdelivr.net/npm/golden-layout@2.6.0/dist/css/themes/goldenlayout-light-theme.css" disabled/>

    <script src="https://nturley.github.io/netlistsvg/elk.bundled.js"></script>
    <script src="https://nturley.github.io/netlistsvg/built/netlistsvg.bundle.js"></script>

    <!-- main.js imports golden-layout by its npm name, which the bundler
         resolves; here the browser maps it. -->
    <script type="importmap">
        {"imports": {"golden-layout": "https://esm.sh/golden-layout@2.6.0"}}
    </script>

    <link rel="stylesheet" href="style.css"/>
</head>
<body>

    <div id="menu-bar"></div>
    <div id="toolbar"></div>
    <div id="gl-container"></div>
    <div id="websocket-status"></div>
    <div id="loading-overlay">
        <div class="loading-overlay-content">
            <div class="spinner"></div>
            <span>Loading shapes…</span>
        </div>
    </div>
    <!-- The globals the bundle's vendor-globals.js sets, then the viewer. -->
    <script type="module">
        import * as THREE from 'https://esm.sh/three@0.160.0';
        window.THREE = THREE;
        // Without the skin only the schematic panel is unready.
        try {
            const resp = await fetch('openroad_skin.svg');
            if (!resp.ok) {
                throw new Error(`${resp.status} ${resp.statusText}`);
            }
            window.openroadSkin = await resp.text();
        } catch (err) {
            console.error('Could not load the schematic skin:', err);
        }
        await import('./main.js');
    </script>

</body>
</html>
