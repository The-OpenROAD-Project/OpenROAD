name: First-Time Contributor Bot

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  greet:
    # Bots, org members, owners and collaborators are never greeted.
    if: |-
      ${{ github.event.sender.type == 'User' &&
          !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
          github.event.issue.author_association || github.event.pull_request.author_association) }}
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted-ubuntu-26.04' || 'ubuntu-26.04' }}
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Greet First-Time Contributor
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # ratchet:actions/github-script@v9.0.0
        env:
          ISSUE_MESSAGE: |
            Welcome to OpenROAD! Thanks for opening your first issue.
            To get started:
            - Build Instructions: https://openroad.readthedocs.io/en/latest/user/Build.html
            - Contribution Guide: https://openroad.readthedocs.io/en/latest/contrib/GettingInvolved.html

            Please search existing issues before submitting to avoid duplicates.
            A maintainer will get back to you soon!
          PR_MESSAGE: |
            Welcome to OpenROAD! Thanks for opening your first PR.
            Before we review:
            - Contribution Guide: https://openroad.readthedocs.io/en/latest/contrib/GettingInvolved.html
            - Build Instructions: https://openroad.readthedocs.io/en/latest/user/Build.html

            Please ensure:
            - CI passes
            - Code is properly formatted
            - Tests are included where applicable
            A maintainer will review shortly!
        with:
          script: |-
            const isPR = context.eventName === 'pull_request_target';
            const item = isPR ? context.payload.pull_request : context.payload.issue;
            const {owner, repo} = context.repo;
            // A PR author is greeted on their first PR, whose message covers
            // CI and review. An issue author is greeted only if they have
            // opened nothing here before, issue or PR. Bounding by creation
            // time keeps the answer right even before the search index has
            // the new item.
            const q = [
              `repo:${owner}/${repo}`,
              ...(isPR ? ['is:pr'] : []),
              `author:${item.user.login}`,
              `created:<${item.created_at}`,
            ].join(' ');
            const {data} = await github.rest.search.issuesAndPullRequests({q, per_page: 1});
            if (data.total_count > 0) {
              core.info(`${item.user.login} has ${data.total_count} earlier ${isPR ? 'PR(s)' : 'issue(s) or PR(s)'}; not greeting.`);
              return;
            }
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: item.number,
              body: isPR ? process.env.PR_MESSAGE : process.env.ISSUE_MESSAGE,
            });
