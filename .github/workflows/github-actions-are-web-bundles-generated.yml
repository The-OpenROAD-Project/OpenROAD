name: Check That Web Bundles Are Generated

# Only what can make the bundles stale: the job pulls a node toolchain and the
# npm tree, and runs the bundler.
on:
  push:
    branches:
    - master
    paths:
    - 'src/web/**'
    - 'MODULE.bazel'
    - 'MODULE.bazel.lock'
  pull_request:
    branches:
    - master
    paths:
    - 'src/web/**'
    - 'MODULE.bazel'
    - 'MODULE.bazel.lock'

permissions:
  contents: read

jobs:
  Are-Web-Bundles-Generated:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up bazel
        # Self-hosted runners lack the bazelisk ubuntu-latest preinstalls; the
        # clang-tidy workflow sets it up the same way.
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86  # 0.19.0
        with:
          bazelisk-version: 1.x
          bazelisk-cache: true

      # dist_tests diffs src/web/dist, which the CMake build embeds, against the
      # bundler's output and prints the fix, without writing to the checkout.
      - name: Check the web bundles and the npm lock against their sources
        run: bazelisk test //src/web/dist:dist_tests //src/web/test:npm_lock_test
