name: Check That Web Bundles Are Generated
# Only what can make the bundles stale: the job pulls a node toolchain and the
# npm tree, and runs the bundler.
on:
  push:
    branches:
      - master
    paths:
      - src/web/src/*.js
      - src/web/src/*.css
      - src/web/src/*.html
      - src/web/src/*.svg
      - src/web/src/collect_licenses.py
      - src/web/src/inline_styles.py
      - src/web/esbuild.config.mjs
      - src/web/package.json
      - src/web/pnpm-lock.yaml
      - src/web/.npmrc
      - src/web/BUILD
      - src/web/dist/**
      - src/web/test/npm_lock_test.py
      - src/web/test/BUILD
      - MODULE.bazel
      - MODULE.bazel.lock
      - .github/workflows/github-actions-are-web-bundles-generated.yml
  pull_request:
    branches:
      - master
    paths:
      - src/web/src/*.js
      - src/web/src/*.css
      - src/web/src/*.html
      - src/web/src/*.svg
      - src/web/src/collect_licenses.py
      - src/web/src/inline_styles.py
      - src/web/esbuild.config.mjs
      - src/web/package.json
      - src/web/pnpm-lock.yaml
      - src/web/.npmrc
      - src/web/BUILD
      - src/web/dist/**
      - src/web/test/npm_lock_test.py
      - src/web/test/BUILD
      - MODULE.bazel
      - MODULE.bazel.lock
      - .github/workflows/github-actions-are-web-bundles-generated.yml
permissions:
  contents: read
jobs:
  Are-Web-Bundles-Generated:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted-ubuntu-26.04' || 'ubuntu-26.04' }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # MODULE.bazel overrides sv-elab to the third-party/sv-elab
          # submodule, so module resolution needs it checked out.
          submodules: recursive
      - name: Set up bazel
        # Self-hosted runners do not preinstall bazelisk; the clang-tidy
        # workflow sets it up the same way.
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3  # 0.19.1
        with:
          bazelisk-version: 1.x
          bazelisk-cache: true

      # The dist tests diff src/web/dist, which the CMake build embeds, against
      # the bundler's output and print the fix, without writing to the checkout.
      - name: Check the web bundle and the npm lock against their sources
        run: bazelisk test //src/web/dist:all //src/web/test:npm_lock_test
