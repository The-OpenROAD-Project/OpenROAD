name: Check That The Web npm Lock Matches package.json
# Only what can make the lock and package.json disagree.
on:
  push:
    branches:
      - master
    paths:
      - openroad/web/package.json
      - openroad/web/pnpm-lock.yaml
      - openroad/web/test/npm_lock_test.py
      - openroad/web/test/BUILD
      - MODULE.bazel
      - MODULE.bazel.lock
      - .github/workflows/github-actions-are-web-bundles-generated.yml
  pull_request:
    branches:
      - master
    paths:
      - openroad/web/package.json
      - openroad/web/pnpm-lock.yaml
      - openroad/web/test/npm_lock_test.py
      - openroad/web/test/BUILD
      - MODULE.bazel
      - MODULE.bazel.lock
      - .github/workflows/github-actions-are-web-bundles-generated.yml
permissions:
  contents: read
jobs:
  Are-Web-Bundles-Generated:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted-ubuntu-26.04' || 'ubuntu-26.04' }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up bazel
        # Self-hosted runners do not preinstall bazelisk; the clang-tidy
        # workflow sets it up the same way.
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab  # 0.19.2
        with:
          bazelisk-version: 1.x
          bazelisk-cache: true

      # setup-bazel installs bazelisk on the PATH as `bazel`.
      - name: Check the npm lock against package.json
        run: bazel test //openroad/web/test:npm_lock_test
