name: Format Code with pre commit trigger

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

jobs:
  Clang-Format:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted-ubuntu-26.04' || 'ubuntu-26.04' }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up bazel
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab  # 0.19.2
        with:
          bazelisk-version: 1.x
          bazelisk-cache: true
      - name: Check C++ formatting
        # //:fmt_cc_test uses the clang-format and the file set of
        # //:lint_test, so a local pass means that this check passes too.
        # setup-bazel installs bazelisk on the PATH as `bazel`.
        run: bazel test --test_output=errors //:fmt_cc_test
