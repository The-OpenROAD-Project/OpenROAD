name: Format Code with pre commit trigger

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

jobs:
  Clang-Format:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted-ubuntu-26.04' || 'ubuntu-26.04' }}
    env:
      # Keep the version aligned with auto-format and generated ODB checks.
      CLANG_FORMAT_VERSION: "23.1.2"
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
      - name: Install clang-format
        run: |
          python3 -m venv "$RUNNER_TEMP/clang-format"
          "$RUNNER_TEMP/clang-format/bin/pip" install --quiet "clang-format==${CLANG_FORMAT_VERSION}"
          echo "$RUNNER_TEMP/clang-format/bin" >> "$GITHUB_PATH"
      - name: Check format of cpp changed files
        run: |
          clang-format --version
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ "${file##*.}" =~ ^(h|C|cc|cp|cpp|c++|CPP|cxx|hh)$ \
                  && "${file}" != "src/sta/"* \
                  && "${file}" != "src/odb/src/codeGenerator/"* \
                  && "${file}" != "third-party/"* ]]; then
              clang-format --dry-run --Werror $file
            fi
          done
