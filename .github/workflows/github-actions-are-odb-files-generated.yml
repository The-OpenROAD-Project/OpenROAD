name: Check That ODB Files Are Generated

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

jobs:
  Are-Odb-Files-Generated:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted-ubuntu-26.04' || 'ubuntu-26.04' }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          submodules: 'recursive'
      - name: Set up bazel
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab  # 0.19.2
        with:
          bazelisk-version: 1.x
          bazelisk-cache: true
      - name: Check that ODB Generated Files Are Up To Date
        run: |
          # The target formats the output with the clang-format that
          # //:fmt_cc_test uses (setup-bazel installs bazelisk as `bazel`).
          bazel run //openroad/odb/src/codeGenerator:gen
          # Only openroad/odb: a reused self-hosted checkout can hold stale files elsewhere.
          if [ -z "$(git status --porcelain -- :/openroad/odb)" ]; then
            exit 0
          else
            echo ::group::Non-Empty Git Status Oputput
            git status --porcelain -- :/openroad/odb
            echo ::endgroup::

            echo ::group::Non-Empty Git Diff Oputput
            git diff -- :/openroad/odb
            echo ::endgroup::

            printf "Your ODB generated files are out of date\n"
            printf "Run 'bazelisk run //openroad/odb/src/codeGenerator:gen' and commit the result\n"
            exit 1
          fi
