name: 📋 Gemini Scheduled Issue Triage
on:
  schedule:
    - cron: 0 * * * *  # Runs every hour
  push:
    branches:
      - master
      - release/**/*
    paths:
      - .github/workflows/gemini-scheduled-triage.yml
      - .github/commands/openroad-scheduled-triage.toml
      - .github/scripts/**
  workflow_dispatch:
    inputs:
      all_ages:
        description: Also triage unlabeled issues opened more than two days ago
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  triage:
    # Gemini triage runs only in the public repository.
    if: github.repository == 'The-OpenROAD-Project/OpenROAD'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    outputs:
      available_labels: ${{ steps.get_labels.outputs.available_labels }}
      issue_numbers: ${{ steps.find_issues.outputs.issue_numbers }}
      triaged_issues: ${{ steps.gemini_issue_analysis.outputs.summary }}
      candidates_built: ${{ steps.build_candidates.outputs.built }}
    steps:
      - name: Get repository labels
        id: get_labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # ratchet:actions/github-script@v9.0.0
        with:
          # NOTE: we intentionally do not use the minted token. The default
          # GITHUB_TOKEN provided by the action has enough permissions to read
          # the labels.
          script: |-
            const labels = [];
            for await (const response of github.paginate.iterator(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100, // Maximum per page to reduce API calls
            })) {
              labels.push(...response.data);
            }
            if (!labels || labels.length === 0) {
              core.setFailed('There are no issue labels in this repository.')
            }
            const labelNames = labels.map(label => label.name).sort();
            core.setOutput('available_labels', labelNames.join(','));
            core.info(`Found ${labelNames.length} labels: ${labelNames.join(', ')}`);
            return labelNames;
      - name: Find untriaged issues
        id: find_issues
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || github.token }}
          ALL_AGES: ${{ inputs.all_ages || false }}
        run: |-
          echo '🔍 Finding unlabeled issues...'
          # Only recent issues are retried, so one that Gemini cannot label
          # (or a stalled API) costs at most about two days of hourly runs.
          # Older ones need a person or a manual run with all_ages.
          SEARCH='no:label'
          if [[ "${ALL_AGES}" != 'true' ]]; then
            SEARCH+=" created:>=$(date -u -d '2 days ago' +%Y-%m-%d)"
          fi
          # Truncate bodies and cap the batch so ISSUES_TO_TRIAGE stays under
          # the 128 KiB Linux limit on a single environment variable; later
          # runs pick up the remaining issues.
          ISSUES="$(gh issue list \
            --state 'open' \
            --search "${SEARCH}" \
            --json number,title,body \
            --limit '20' \
            --repo "${GITHUB_REPOSITORY}" |
            jq -c 'map(.body = ((.body // "") | .[0:3000]))'
          )"
          echo '📝 Setting output for GitHub Actions...'
          echo "issues_to_triage=${ISSUES}" >> "${GITHUB_OUTPUT}"
          ISSUE_NUMBERS="$(echo "${ISSUES}" | jq -r '.[].number | tostring' | paste -sd, -)"
          echo "issue_numbers=${ISSUE_NUMBERS}" >> "${GITHUB_OUTPUT}"
          ISSUE_COUNT="$(echo "${ISSUES}" | jq 'length')"
          echo "✅ Found ${ISSUE_COUNT} issue(s) to triage! 🎯"
      # The Gemini action installs its own gemini-*.toml commands, so ours
      # use distinct names to avoid being overwritten.
      - name: Checkout triage commands and scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |-
            .github/CODEOWNERS
            .github/commands
            .github/scripts
          sparse-checkout-cone-mode: false
      - name: Install triage commands
        run: |-
          mkdir -p .gemini/commands
          cp .github/commands/openroad-*.toml .gemini/commands/
      # Assignee candidates are best effort: these steps may fail without
      # failing the job, and labeling then runs without assignments.
      # Reading CODEOWNERS team membership needs the App's org-level
      # "Members: read" permission. The token is read-only and never reaches
      # the Gemini step.
      - name: Mint candidates token
        id: candidates_token
        continue-on-error: true
        if: |-
          ${{ vars.APP_CLIENT_ID && steps.find_issues.outputs.issues_to_triage != '[]' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # ratchet:actions/create-github-app-token@v2
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: read
          permission-members: read
      # Exports the masked table as ASSIGNEE_CANDIDATES.
      - name: Build assignee candidates
        id: build_candidates
        continue-on-error: true
        if: steps.candidates_token.outputs.token != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # ratchet:actions/github-script@v9.0.0
        with:
          github-token: ${{ steps.candidates_token.outputs.token }}
          script: |-
            const run = require('./.github/scripts/triage-candidates.js');
            await run({github, context, core});
      - name: Run Gemini Issue Analysis
        id: gemini_issue_analysis
        if: |-
          ${{ steps.find_issues.outputs.issues_to_triage != '[]' }}
        # A Gemini API call can stall without any output; failing here leaves
        # the issues unlabeled, so the next hourly run retries them.
        timeout-minutes: 5
        uses: google-github-actions/run-gemini-cli@v0  # ratchet:exclude
        env:
          # The workspace holds only the checked-out commands and the
          # action's settings; issue text arrives through env vars.
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: '' # Do not pass any auth token here since this runs on untrusted inputs
          ISSUES_TO_TRIAGE: ${{ steps.find_issues.outputs.issues_to_triage }}
          REPOSITORY: ${{ github.repository }}
          AVAILABLE_LABELS: ${{ steps.get_labels.outputs.available_labels }}
        with:
          gcp_location: ${{ vars.GOOGLE_CLOUD_LOCATION }}
          gcp_project_id: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          gcp_service_account: ${{ vars.SERVICE_ACCOUNT_EMAIL }}
          gcp_workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_cli_version: ${{ vars.GEMINI_CLI_VERSION }}
          gemini_debug: ${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}
          gemini_model: ${{ vars.GEMINI_MODEL }}
          google_api_key: ${{ secrets.GOOGLE_API_KEY }}
          use_gemini_code_assist: ${{ vars.GOOGLE_GENAI_USE_GCA }}
          use_vertex_ai: ${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}
          upload_artifacts: ${{ vars.UPLOAD_ARTIFACTS }}
          workflow_name: gemini-scheduled-triage
          # Overriding default telemetry inputs because scheduled workflows lack an event payload
          # We pass the dynamically generated list of batch issues to the issue number field
          github_issue_number: ${{ steps.find_issues.outputs.issue_numbers }}
          # In GitHub Actions the CLI passes shell commands only its own list
          # of environment variables, so the prompt's `!{echo $VAR}` reads
          # any other variable, such as ASSIGNEE_CANDIDATES, as empty unless
          # it is allowed here.
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "security": {
                "environmentVariableRedaction": {
                  "allowed": [
                    "ASSIGNEE_CANDIDATES"
                  ]
                }
              },
              "tools": {
                "core": [
                  "run_shell_command(echo)"
                ]
              }
            }
          prompt: /openroad-scheduled-triage
  label:
    runs-on: ubuntu-latest
    needs:
      - triage
    if: |-
      !cancelled() &&
      needs.triage.result == 'success' &&
      needs.triage.outputs.available_labels != '' &&
      needs.triage.outputs.available_labels != '[]' &&
      needs.triage.outputs.triaged_issues != '' &&
      needs.triage.outputs.triaged_issues != '[]'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # Without the App token, labels are applied with GITHUB_TOKEN and
      # assignment is skipped.
      - name: Mint identity token
        id: mint_identity_token
        continue-on-error: true
        if: |-
          ${{ vars.APP_CLIENT_ID }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # ratchet:actions/create-github-app-token@v2
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-members: read
          permission-pull-requests: write
      # Only assignment needs these files; labeling must not depend on them.
      - name: Checkout triage scripts
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |-
            .github/CODEOWNERS
            .github/scripts
          sparse-checkout-cone-mode: false
      - name: Apply labels and assignees
        env:
          AVAILABLE_LABELS: ${{ needs.triage.outputs.available_labels }}
          HAS_APP_TOKEN: ${{ steps.mint_identity_token.outputs.token != '' }}
          # Gemini picks from the candidate table; without one, its assignee
          # is not trusted and only labels are applied.
          CANDIDATES_BUILT: ${{ needs.triage.outputs.candidates_built }}
          ISSUE_NUMBERS: ${{ needs.triage.outputs.issue_numbers }}
          TRIAGED_ISSUES: ${{ needs.triage.outputs.triaged_issues }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # ratchet:actions/github-script@v9.0.0
        with:
          # Use the provided token so that the "gemini-cli" is the actor in the
          # log for what changed the labels.
          github-token: ${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}
          script: |-
            // Parse the available labels
            const availableLabels = (process.env.AVAILABLE_LABELS || '').split(',')
              .map((label) => label.trim())
              .sort()
            // Only the issues sent to Gemini may be labeled, so a prompt
            // injection cannot redirect labels to other issues or PRs
            const batchIssueNumbers = (process.env.ISSUE_NUMBERS || '').split(',')
              .map((number) => Number(number.trim()))
            // Parse out the triaged issues, tolerating a markdown code fence
            // or preamble around the model's JSON reply
            let triagedIssues;
            try {
              const text = process.env.TRIAGED_ISSUES || '[]';
              const fenced = text.match(/```(?:json)?\s*([\s\S]*?)\s*```/);
              const span = (fenced ? fenced[1] : text).match(/\[[\s\S]*\]/);
              triagedIssues = JSON.parse(span ? span[0] : '');
            } catch (err) {
              core.setFailed(`Gemini reply is not valid JSON: ${err.message}`);
              return;
            }
            if (!Array.isArray(triagedIssues)) {
              core.setFailed('Gemini reply is not a JSON array.');
              return;
            }
            // Drop non-object entries before sorting so one bad entry cannot
            // abort the batch
            triagedIssues = triagedIssues
              .filter((issue) => issue && typeof issue === 'object')
              .sort((a, b) => a.issue_number - b.issue_number)
            // Assignment is best effort: without the App token or the scripts
            // it is skipped, and labeling continues.
            let assign = null;
            let allowed = '';
            if (process.env.HAS_APP_TOKEN !== 'true') {
              core.info('No App token; skipping assignment.');
            } else if (process.env.CANDIDATES_BUILT !== 'true') {
              core.info('No assignee candidates; skipping assignment.');
            } else {
              try {
                const {allowedAssignees} = require('./.github/scripts/triage-candidates.js');
                assign = require('./.github/scripts/triage-assign.js');
                allowed = (await allowedAssignees({github, core})).join(',');
              } catch (err) {
                assign = null;
                core.warning(`Assignment disabled: ${err.message}`);
              }
            }
            core.debug(`Triaged issues: ${JSON.stringify(triagedIssues)}`);
            // Iterate over each label
            for (const issue of triagedIssues) {
              if (!issue) {
                core.debug(`Skipping empty issue: ${JSON.stringify(issue)}`);
                continue;
              }
              const issueNumber = issue.issue_number;
              if (!issueNumber) {
                core.debug(`Skipping issue with no data: ${JSON.stringify(issue)}`);
                continue;
              }
              if (!batchIssueNumbers.includes(Number(issueNumber))) {
                core.warning(`Skipping issue  #${issueNumber} - not in the triage batch.`);
                continue;
              }
              // Extract and reject invalid labels - we do this just in case
              // someone was able to prompt inject malicious labels.
              let labelsToSet = (Array.isArray(issue.labels_to_set) ? issue.labels_to_set : [])
                .map((label) => String(label).replace(/`/g, '').trim())
                .filter((label) => availableLabels.includes(label))
                .sort()
              core.debug(`Identified labels to set: ${JSON.stringify(labelsToSet)}`);
              if (labelsToSet.length === 0) {
                core.info(`Skipping issue  #${issueNumber} - no labels to set.`)
                continue;
              }
              core.debug(`Setting labels on issue  #${issueNumber} to ${labelsToSet.join(', ')} (${issue.explanation || 'no explanation'})`)
              // Add rather than replace, so labels a maintainer set are kept.
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: labelsToSet,
              });
              // Assignment is best effort; a failure must not stop the batch.
              try {
                if (assign) {
                  await assign({
                    github,
                    context,
                    core,
                    issueNumber: Number(issueNumber),
                    labels: labelsToSet,
                    primaryLabel: String(issue.primary_label || '').replace(/`/g, '').trim(),
                    assignee: issue.assignee,
                    allowed,
                  });
                }
              } catch (err) {
                core.warning(`#${issueNumber}: assignment failed: ${err.message}`);
              }
            }
